<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Student Deals Hub</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f2f2f7;
      --card-bg:  #ffffff;
      --sep:      #c6c6c8;
      --text:     #1c1c1e;
      --text2:    #6d6d72;
      --text3:    #aeaeb2;
      --blue:     #007aff;
      --green:    #34c759;
      --red:      #ff3b30;
      --orange:   #ff9500;
      --purple:   #af52de;
      --teal:     #5ac8fa;
      --tab-bg:       rgba(242,242,247,0.92);
      --tab-border:   rgba(0,0,0,0.12);
      --tab-active:   #007aff;
      --tab-inactive: #8e8e93;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top:    env(safe-area-inset-top, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:       #000000;
        --card-bg:  #1c1c1e;
        --sep:      #38383a;
        --text:     #ffffff;
        --text2:    #ebebf5cc;
        --text3:    #ebebf560;
        --tab-bg:   rgba(28,28,30,0.92);
        --tab-border: rgba(255,255,255,0.1);
      }
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── STICKY HEADER ── */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 200;
      background: var(--tab-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 0.5px solid var(--tab-border);
      padding-top: var(--safe-top);
    }

    .header-inner {
      padding: 12px 16px 8px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .app-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
      line-height: 1;
    }

    .deals-count-pill {
      font-size: 12px;
      font-weight: 600;
      background: var(--blue);
      color: #fff;
      padding: 3px 10px;
      border-radius: 20px;
    }

    /* Search bar — native iOS style */
    .search-wrap {
      position: relative;
      margin-bottom: 8px;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text3);
      font-size: 14px;
      pointer-events: none;
    }

    #search {
      width: 100%;
      background: var(--sep);
      border: none;
      border-radius: 10px;
      padding: 8px 12px 8px 32px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      outline: none;
      -webkit-appearance: none;
    }

    #search::placeholder { color: var(--text3); }

    /* Category horizontal scroll pills */
    .cat-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0 10px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .cat-scroll::-webkit-scrollbar { display: none; }

    .cat-pill {
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 20px;
      border: none;
      background: var(--sep);
      color: var(--text2);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, color 0.15s;
    }

    .cat-pill.active {
      background: var(--blue);
      color: #ffffff;
      font-weight: 600;
    }

    /* ── MAIN SCROLL AREA ── */
    #scroll-area {
      padding: 12px 0 calc(80px + var(--safe-bottom));
      overflow-y: auto;
    }

    /* Section header */
    .section-header {
      padding: 18px 16px 6px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-count {
      font-size: 13px;
      font-weight: 500;
      color: var(--text3);
      margin-left: 2px;
    }

    /* Inset grouped list — native iOS style */
    .card-group {
      margin: 0 16px 4px;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
    }

    .deal-row {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      gap: 12px;
      border-bottom: 0.5px solid var(--sep);
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
      cursor: pointer;
    }

    .deal-row:last-child { border-bottom: none; }

    .deal-row:active { background: var(--sep); }

    /* Icon circle */
    .deal-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: #ffffff;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.13), 0 0 0 0.5px rgba(0,0,0,0.06);
    }

    .deal-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 7px;
      border-radius: 10px;
    }

    .deal-text { flex: 1; min-width: 0; }

    .deal-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .deal-desc {
      font-size: 12px;
      color: var(--text2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .deal-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }

    .deal-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      white-space: nowrap;
      letter-spacing: 0.2px;
    }

    .b-free   { background: #d4f0dc; color: #1a7f37; }
    .b-off    { background: #fde8e8; color: #c0392b; }
    .b-credit { background: #ede8f5; color: #6d28d9; }
    .b-other  { background: #fef3cd; color: #92600a; }

    @media (prefers-color-scheme: dark) {
      .b-free   { background: #0d3320; color: #3dd68c; }
      .b-off    { background: #3a0f0f; color: #ff6b6b; }
      .b-credit { background: #2a1a44; color: #c084fc; }
      .b-other  { background: #3a2800; color: #fbbf24; }
    }

    .chevron {
      color: var(--text3);
      font-size: 14px;
      margin-left: 2px;
    }

    /* ── EMPTY STATE ── */
    #empty {
      display: none;
      text-align: center;
      padding: 80px 32px;
      color: var(--text3);
    }
    #empty .empty-emoji { font-size: 48px; margin-bottom: 12px; }
    #empty p { font-size: 15px; }

    /* ── BOTTOM TAB BAR — native app style ── */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0; right: 0;
      z-index: 300;
      background: var(--tab-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-top: 0.5px solid var(--tab-border);
      padding-bottom: var(--safe-bottom);
      display: flex;
      align-items: stretch;
    }

    .tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 4px 4px;
      gap: 3px;
      cursor: pointer;
      border: none;
      background: none;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.1s;
      min-height: 50px;
    }

    .tab:active { opacity: 0.6; }

    .tab-icon {
      font-size: 22px;
      line-height: 1;
      position: relative;
    }

    .tab-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1px;
      color: var(--tab-inactive);
    }

    .tab.active .tab-label {
      color: var(--tab-active);
      font-weight: 600;
    }

    /* Active tab icon tint via filter */
    .tab.active .tab-icon { filter: none; }
    .tab:not(.active) .tab-icon { opacity: 0.45; }

    /* Badge on tab icon */
    .tab-badge {
      position: absolute;
      top: -4px; right: -8px;
      background: var(--red);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      min-width: 16px;
      height: 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
    }

    /* ── DETAIL SHEET (slides up) ── */
    .sheet-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 400;
      align-items: flex-end;
    }
    .sheet-overlay.open { display: flex; }

    .sheet {
      width: 100%;
      background: var(--card-bg);
      border-radius: 16px 16px 0 0;
      padding-bottom: calc(32px + var(--safe-bottom));
      max-height: 88vh;
      overflow-y: auto;
      animation: slideUp 0.32s cubic-bezier(0.32,0.72,0,1);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .sheet-handle {
      width: 36px; height: 4px;
      background: var(--sep);
      border-radius: 2px;
      margin: 10px auto 0;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px 12px;
      border-bottom: 0.5px solid var(--sep);
    }

    .sheet-icon {
      width: 60px; height: 60px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
      overflow: hidden;
      background: #f2f2f7;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .sheet-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 9px;
    }

    .sheet-title { font-size: 18px; font-weight: 700; color: var(--text); }
    .sheet-cat   { font-size: 13px; color: var(--text2); margin-top: 2px; }

    .sheet-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }

    .sheet-desc {
      font-size: 15px;
      color: var(--text);
      line-height: 1.5;
    }

    .sheet-meta-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 14px;
      color: var(--text2);
    }
    .sheet-meta-row .label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      min-width: 80px;
      padding-top: 1px;
    }

    .sheet-cta {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--blue);
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      border: none;
      margin-top: 4px;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }
    .sheet-cta:active { opacity: 0.8; }

    /* Icon bg colors per category */
    .ic-dev  { background: #e8f0fe; }
    .ic-des  { background: #fce8f3; }
    .ic-ai   { background: #e8f5e9; }
    .ic-cld  { background: #e3f2fd; }
    .ic-lrn  { background: #fff8e1; }
    .ic-pro  { background: #f3e5f5; }
    .ic-com  { background: #e0f7fa; }
    .ic-ent  { background: #fbe9e7; }
    .ic-pfx  { background: #e8eaf6; }
    .ic-gmd  { background: #e8f5e9; }

    @media (prefers-color-scheme: dark) {
      .ic-dev { background: #1a2a4a; }
      .ic-des { background: #3a1a2a; }
      .ic-ai  { background: #1a3a1a; }
      .ic-cld { background: #1a2a3a; }
      .ic-lrn { background: #3a2a00; }
      .ic-pro { background: #2a1a3a; }
      .ic-com { background: #003a3a; }
      .ic-ent { background: #3a1a10; }
      .ic-pfx { background: #1a1a3a; }
      .ic-gmd { background: #0a2a1a; }
    }
  </style>
</head>

</div>

const CAT_ORDER = ["Development","Design","AI","Cloud","Learning","Productivity","Communication","Entertainment","Professional","Game Dev"];

// tabs that map to categories
const TAB_CATS = {
  all: null,
  development: "Development",
  design: "Design",
  ai: "AI",
  cloud: "Cloud",
  more: null  // opens a sheet with remaining cats
};

const MORE_CATS = ["Learning","Productivity","Communication","Entertainment","Professional","Game Dev"];

function badgeClass(d) {
  const u = d.toUpperCase();
  if (/^FREE/.test(u) || u.includes("FREE TIER") || u.includes("FREE (")) return "b-free";
  if (u.includes("OFF")) return "b-off";
  if (u.includes("CREDIT") || /^\$[0-9]/.test(u) || u.includes("1.99") || u.includes("8.33")) return "b-credit";
  return "b-other";
}

let activeTab = 'all';
let activeCatFilter = null; // null = all
let term = '';

const mainEl     = document.getElementById('main');
const emptyEl    = document.getElementById('empty');
const countPill  = document.getElementById('deals-count-pill');

function getFiltered() {
  return DEALS.filter(d => {
    const matchSearch = !term || [d.name, d.desc, d.cat, d.discount].some(s => s.toLowerCase().includes(term));
    const matchCat = !activeCatFilter || d.cat === activeCatFilter;
    return matchSearch && matchCat;
  });
}

function render() {
  const list = getFiltered();
  countPill.textContent = list.length + ' deal' + (list.length !== 1 ? 's' : '');
  mainEl.innerHTML = '';
  emptyEl.style.display = list.length ? 'none' : 'block';
  if (!list.length) return;

  const grouped = {};
  CAT_ORDER.forEach(c => grouped[c] = []);
  list.forEach(d => grouped[d.cat]?.push(d));

  CAT_ORDER.forEach(cat => {
    const items = grouped[cat];
    if (!items?.length) return;

    const section = document.createElement('div');

    const hdr = document.createElement('div');
    hdr.className = 'section-header';
    hdr.innerHTML = `${cat} <span class="section-count">${items.length}</span>`;
    section.appendChild(hdr);

    const group = document.createElement('div');
    group.className = 'card-group';

    items.forEach(d => {
      const row = document.createElement('div');
      row.className = 'deal-row';
      row.innerHTML = `
        <div class="deal-icon ${d.iconCls}">
          <img src="${d.logo}" alt="${d.name}" onerror="this.parentElement.textContent='🎓'" loading="lazy" />
        </div>
        <div class="deal-text">
          <div class="deal-name">${d.name}</div>
          <div class="deal-desc">${d.desc}</div>
        </div>
        <div class="deal-right">
          <span class="deal-badge ${badgeClass(d.discount)}">${d.discount}</span>
          <span class="chevron">›</span>
        </div>`;
      row.addEventListener('click', () => openSheet(d));
      group.appendChild(row);
    });

    section.appendChild(group);
    mainEl.appendChild(section);
  });
}

// ── SHEET ──
const overlay  = document.getElementById('sheet-overlay');
const sheet    = document.getElementById('sheet');

function openSheet(d) {
  document.getElementById('sheet-icon').className = `sheet-icon ${d.iconCls}`;
  document.getElementById('sheet-icon').innerHTML = `<img src="${d.logo}" alt="${d.name}" onerror="this.parentElement.textContent='🎓'" style="width:100%;height:100%;object-fit:contain;padding:8px;" />`;
  document.getElementById('sheet-title').textContent = d.name;
  document.getElementById('sheet-cat').textContent = d.cat;
  document.getElementById('sheet-desc').textContent = d.desc;
  document.getElementById('sheet-discount').textContent = d.discount;
  document.getElementById('sheet-req').textContent = d.req;
  const noteRow = document.getElementById('sheet-note-row');
  if (d.note) {
    document.getElementById('sheet-note').textContent = d.note;
    noteRow.style.display = 'flex';
  } else {
    noteRow.style.display = 'none';
  }
  document.getElementById('sheet-cta').href = d.link;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

overlay.addEventListener('click', e => {
  if (e.target === overlay) closeSheet();
});

function closeSheet() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

// ── BOTTOM TABS ──
document.getElementById('tab-bar').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  const tab = btn.dataset.tab;

  if (tab === 'more') {
    showMoreSheet();
    return;
  }

  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  activeTab = tab;
  activeCatFilter = TAB_CATS[tab] ?? null;
  term = '';
  document.getElementById('search').value = '';
  // reset cat pills
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
  document.querySelector('.cat-pill[data-f="all"]').classList.add('active');
  render();
  document.getElementById('scroll-area').scrollTop = 0;
});

// More sheet — show remaining categories
let moreSheetEl = null;
function showMoreSheet() {
  if (!moreSheetEl) {
    moreSheetEl = document.createElement('div');
    moreSheetEl.className = 'sheet-overlay';
    moreSheetEl.innerHTML = `
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div style="padding:16px 20px 8px; font-size:20px; font-weight:700; color:var(--text);">More Categories</div>
        <div class="card-group" style="margin:8px 16px 24px;">
          ${MORE_CATS.map(cat => {
            const icons = {"Learning":"📚","Productivity":"⚡","Communication":"💬","Entertainment":"🎵","Professional":"💼","Game Dev":"🎮"};
            const count = DEALS.filter(d=>d.cat===cat).length;
            return `<div class="deal-row" data-more-cat="${cat}">
              <div class="deal-icon" style="background:var(--sep); font-size:22px;">${icons[cat]||'📁'}</div>
              <div class="deal-text"><div class="deal-name">${cat}</div><div class="deal-desc">${count} deals available</div></div>
              <span class="chevron">›</span>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    document.body.appendChild(moreSheetEl);
    moreSheetEl.addEventListener('click', e => {
      const row = e.target.closest('[data-more-cat]');
      if (row) {
        const cat = row.dataset.moreCat;
        moreSheetEl.classList.remove('open');
        document.body.style.overflow = '';
        activeCatFilter = cat;
        term = '';
        document.getElementById('search').value = '';
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector('[data-tab="more"]').classList.add('active');
        document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
        document.querySelector('.cat-pill[data-f="all"]').classList.add('active');
        render();
        document.getElementById('scroll-area').scrollTop = 0;
        return;
      }
      if (e.target === moreSheetEl) {
        moreSheetEl.classList.remove('open');
        document.body.style.overflow = '';
      }
    });
  }
  moreSheetEl.classList.add('open');
  document.body.style.overflow = 'hidden';
}

// ── CATEGORY SCROLL PILLS (filter within current tab) ──
document.getElementById('cat-scroll').addEventListener('click', e => {
  const btn = e.target.closest('.cat-pill');
  if (!btn) return;
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  const f = btn.dataset.f;
  // override activeCatFilter only for free/discounted/credits sub-filters
  if (f === 'all') {
    activeCatFilter = TAB_CATS[activeTab] ?? null;
  } else {
    activeCatFilter = null; // search across all cats with tag filter
    // use tag based override
    activeTagFilter = f;
  }
  activeTagFilter = f === 'all' ? null : f;
  render();
});

let activeTagFilter = null;

// patch getFiltered to handle tag filter too
const origGetFiltered = getFiltered;
function getFiltered() {
  return DEALS.filter(d => {
    const matchSearch = !term || [d.name, d.desc, d.cat, d.discount].some(s => s.toLowerCase().includes(term));
    const matchCat = activeTagFilter ? true : (!activeCatFilter || d.cat === activeCatFilter);
    const matchTag = !activeTagFilter || d.tags.includes(activeTagFilter);
    const matchTabCat = activeTagFilter ? true : (!activeCatFilter || d.cat === activeCatFilter);
    return matchSearch && matchTag && matchTabCat;
  });
}

// ── SEARCH ──
document.getElementById('search').addEventListener('input', e => {
  term = e.target.value.toLowerCase().trim();
  render();
});

render();
</script>
